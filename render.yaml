services:
  - type: web
    name: vaanicare
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: vaanicare-db
          property: connectionString
      # Sarvam API platform key (speech-to-text + LLM)
      - key: SARVAM_API_KEY
        sync: false
      # Sarvam Voice Agents (follow-up calls)
      - key: SARVAM_AGENT_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_AGENT_ID
        sync: false
      - key: SARVAM_AGENT_VERSION
        value: "2"
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE
        sync: false
      # Gemma 4 on the Gemini API judges the follow-up call evals
      - key: GEMINI_API_KEY
        sync: false
      - key: EVAL_MODEL
        value: gemma-4-26b-a4b-it

databases:
  - name: vaanicare-db
    plan: free
